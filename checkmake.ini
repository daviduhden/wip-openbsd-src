# checkmake configuration for wip-openbsd-src.
#
# The Makefiles in this repository are OpenBSD make(1) Makefiles using
# /usr/share/mk.  checkmake assumes GNU make semantics and does not
# expand .include directives, so its minphony rule cannot see the
# all/clean targets that bsd.prog.mk, bsd.lib.mk and bsd.subdir.mk
# provide, and it requires a "test" target that BSD make conventionally
# calls "regress".  That rule is disabled.
#
# The remaining rules stay enabled and are reported as advisories with
# per-class dispositions by validate-make.sh:
#
#   phonydeclared  false positive: the .PHONY declarations come from
#                  the OpenBSD bsd.*.mk include chain, or the flagged
#                  targets are real files that must not be phony.
#   maxbodylength  not actionable: generic GNU-make body-length
#                  threshold; splitting the OpenBSD recipes into
#                  helper targets would only harm the Makefiles.
#
# No checkmake rule is globally disabled beyond minphony so that
# genuinely new findings remain visible.

[minphony]
disabled = true
