name: Agent Knowledge Validation

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base revision for optional committed-range validation
        required: false
        type: string
      host_tests:
        description: Run the sanitised host C suites
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: agent-knowledge-validation-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  validate-agent-knowledge:
    name: Agent Knowledge Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run canonical contract tests
        run: prove tests/agent_knowledge_validator/test_validator.pl
      - name: Run canonical worktree validation
        run: perl scripts/validate-agent-knowledge.pl --scope worktree
      - name: Validate the selected committed range
        if: inputs.base != ''
        env:
          REVIEW_BASE: ${{ inputs.base }}
        run: |
          git rev-parse --verify --end-of-options "${REVIEW_BASE}^{commit}" >/dev/null
          test -z "$(git status --porcelain)"
          perl scripts/validate-agent-knowledge.pl --scope range --base "$REVIEW_BASE" --head HEAD
      - name: Install host test tools
        if: inputs.host_tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bmake clang libx11-dev libxext-dev libxpm-dev
      - name: Run host suites
        if: inputs.host_tests
        run: |
          uname -srmo
          clang --version
          bmake -C tests CC=clang run
          bmake -C libc/tests CC=clang run
